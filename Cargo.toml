# Virtual workspace root. The binary lives in crates/ferrite; future subsystem
# crates (core, dns, proxy, …) join as siblings under crates/.
[workspace]
resolver = "3"
members = ["crates/*"]
# `cargo build` / `cargo run` at the root build the binary, not every member —
# release CI relies on this (`cargo build --release --target …`).
default-members = ["crates/ferrite"]

[workspace.package]
version = "0.1.7"
edition = "2024"
rust-version = "1.96"
license = "MIT"
