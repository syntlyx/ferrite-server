# Built-in service catalog: named sets of domains that a profile, or the whole
# network, can block (`services = ["tiktok"]`) and a tunnel rule can route
# (`service = "youtube"`). Compiled into the binary, so it ships and updates
# with releases.
#
# Every domain matches itself and all of its subdomains, like a manual
# blocklist entry. List only domains the service owns: shared infrastructure
# (generic CDNs, googleapis.com, akamaihd.net) would catch unrelated sites.
# A specific host on shared infrastructure is fine (`yt3.ggpht.com`).
#
# `routable = false` keeps a service out of tunnel rules. Tunnels answer DNS
# with ferrite's own address and forward only HTTP and TLS on ports 80/443, so
# a service that also talks its own protocol to a resolved name (messengers,
# game launchers and consoles, Spotify's access points) would break if routed.
# Blocking works the same for every service.
#
# Categories: video, music, social, messaging, gaming, ai, shopping.
# `ferrite_core::services` tests check ids, categories and domain syntax, and
# that no domain is listed twice.

# ── Video ────────────────────────────────────────────────────────────────────

